[project]
name = "qcdata"
version = "0.23.1"
description = "Beautiful and user friendly data structures for quantum chemistry."
readme = "README.md"
authors = [{ name = "Colton Hicks", email = "github@coltonhicks.com" }]
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["quantum-chemistry", "data-structures", "cheminformatics"]
dependencies = [
    "pydantic>=2.0.0, !=2.0.1, !=2.1.0",
    "numpy>=1.20",
    "toml>=0.10.2",
    "pyyaml>=6.0",
    "typing-extensions>=4.7.1",
    "eval-type-backport>=0.2.0",
    "qcref>=0.3.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
]
[project.urls]
Homepage = "https://github.com/atomsforhumanity/qcdata"
Documentation = "https://qcdata.docs.afh.org"
Source = "https://github.com/atomsforhumanity/qcdata"
Changelog = "https://github.com/atomsforhumanity/qcdata/blob/master/CHANGELOG.md"
"Bug Tracker" = "https://github.com/atomsforhumanity/qcdata/issues"
repository = "https://github.com/atomsforhumanity/qcdata"


[project.optional-dependencies]
view = [
    "matplotlib>=3.0.0",
    "ipython>=8.0.0",
    "py3Dmol>=2.2.1",
    "rdkit>=2022.3.3",
    "qcinf>=0.4.1",
]
all = [
    "matplotlib>=3.0.0",
    "ipython>=8.0.0",
    "py3Dmol>=2.2.1",
    "rdkit>=2022.3.3",
    "qcinf>=0.4.1",
]

[dependency-groups]
dev = [
    "ruff>=0.12",
    "mypy>=1.15",
    "pytest>=8.3",
    "pre-commit>=4.0",
    "pytest-cov>=6.0",
    "jsonschema>=4.0",
    "types-toml>=0.10.8.6",
    "types-pyyaml>=6.0.12.10",
    "rdkit>=2022.9.5",
    "jupyterlab>=4.2.4",
    "matplotlib>=3.0.0",
    "py3Dmol>=2.2.1",
    "pint>=0.24.4",
    "qcinf>=0.4.1",
    # qcinf[all] adds Open Babel, which has no Python 3.15 wheels yet.
    "qcinf[all]>=0.4.1; python_version < '3.15'",
    "pre-commit-hooks>=5.0",
    "detect-secrets>=1.5",
    "typos>=1.30",
]

docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.30",
    "markdown-include>=0.8.1",
    "pymdown-extensions>=10.9,<11",
    "mkdocstrings[python]>=0.25.2",
    "mkdocs-exclude>=1.0.2",
    "mknotebooks>=0.8.0",
]

[build-system]
requires = ["hatchling>=1.22"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["*.ipynb", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D"]
ignore = ["E501"] # line length is the formatter's job

[tool.ruff.lint.isort]
known-first-party = ["qcdata", "tests"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"scripts/**" = ["D"]
"docs/**" = ["D"]
"examples/**" = ["D"]
"build_tools/**" = ["D"]

[tool.coverage.run]
branch = true
source = ["qcdata"]

[tool.coverage.report]
show_missing = true

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.mypy]
python_version = "3.11"
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
